name: Check Vite Plugin Preview

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      commit:
        description: "solid-vite-plugin commit SHA. Leave empty for next."
        required: false
        default: ""

permissions: {}

concurrency:
  group: vite-plugin-preview-${{ inputs.commit || 'next' }}
  cancel-in-progress: false

env:
  ISSUE: "3"
  UPSTREAM_REPO: solidjs/solid-vite-plugin

jobs:
  target:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve unattempted next commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          if [ -n "$TARGET" ]; then
            if ! [[ "$TARGET" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
              echo "commit must be a 7-40 character SHA" >&2
              exit 1
            fi
            SHA=$(gh api "repos/$UPSTREAM_REPO/commits/$TARGET" --jq .sha)
          else
            SHA=$(git ls-remote "https://github.com/$UPSTREAM_REPO.git" refs/heads/next | cut -f1)
          fi
          if jq -e --arg sha "$SHA" '.builds[]? | select(.sha == $sha)' vite-plugin-previews.json >/dev/null; then
            echo "$SHA is already recorded"
            exit 0
          fi
          if [ -z "$TARGET" ] && jq -e --arg sha "$SHA" '.failures[]? | select(.sha == $sha)' vite-plugin-failures.json >/dev/null; then
            echo "$SHA previously failed; waiting for a manual retry"
            exit 0
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

  publish:
    needs: target
    if: needs.target.outputs.sha != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: solidjs/solid-vite-plugin
          ref: ${{ needs.target.outputs.sha }}
          path: vite-plugin
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/setup@v2
        with:
          version: 11.1.1
          install: false
      - uses: actions/setup-node@v5
        with:
          # solid-vite-plugin does not carry an .nvmrc; its package.json
          # supports Node 20.19+ or 22.12+, so use the current LTS line.
          node-version: 24
          cache: pnpm
          cache-dependency-path: vite-plugin/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: vite-plugin
        run: pnpm install --frozen-lockfile
      - name: Build plugin
        working-directory: vite-plugin
        run: pnpm run build
      - name: Publish preview package
        working-directory: vite-plugin
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Publish under the repository that owns this workflow. This avoids
          # cross-repository workflow association errors in pkg.pr.new.
          jq '.repository = {type: "git", url: "git+https://github.com/mizulu/solid2.git"}' \
            package.json > package.json.tmp
          mv package.json.tmp package.json
          pnpm -w add -D pkg-pr-new
          # Explicitly select the checked-out root package so the upload can be
          # verified independently if pkg.pr.new's check integration fails.
          # This is a cross-repository commit, so pkg.pr.new may fail while
          # creating its normal GitHub check against mizulu/solid2 after the
          # package has already uploaded. Mirror the Solid preview workflow:
          # retain the error status, then accept it only if the package URL is
          # actually available.
          set +e
          pnpm exec pkg-pr-new publish --no-compact --comment=off --json /tmp/pkg-pr-new.json './' 2>&1 | tee /tmp/pkg-pr-new.log
          PUBLISH_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "$PUBLISH_STATUS" -eq 0 ]; then
            exit 0
          fi

          URL="https://pkg.pr.new/$REPO/@solidjs/vite-plugin@$SHA"
          if curl --retry 10 --retry-delay 2 --fail --silent --show-error --range 0-0 --output /dev/null "$URL"; then
            echo "pkg-pr-new returned $PUBLISH_STATUS after upload, but the preview URL is available; treating the publish as successful."
            exit 0
          fi

          echo "pkg-pr-new failed and the preview URL is unavailable: $URL" >&2
          exit "$PUBLISH_STATUS"
      - name: Record and announce preview
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          MIRROR_URL="https://pkg.pr.new/$REPO/@solidjs/vite-plugin@$SHA"
          UPSTREAM_URL="https://pkg.pr.new/solidjs/solid-vite-plugin/@solidjs/vite-plugin@$SHA"
          UPSTREAM_LINE=""
          if curl --retry 3 --retry-delay 1 --fail --silent --show-error --range 0-0 --output /dev/null "$UPSTREAM_URL"; then
            UPSTREAM_LINE=$'\nUpstream preview (already available): '"$UPSTREAM_URL"
          fi
          jq --arg sha "$SHA" --arg completedAt "$NOW" --arg url "$MIRROR_URL" \
            '.builds = ((.builds // []) | map(select(.sha != $sha)) + [{sha:$sha, completedAt:$completedAt, url:$url}])' \
            vite-plugin-previews.json > vite-plugin-previews.json.tmp
          mv vite-plugin-previews.json.tmp vite-plugin-previews.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite-plugin-previews.json
          git commit -m "ci: record Vite plugin preview for $SHA"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
          gh issue comment "$ISSUE" --repo "$REPO" --body "Vite plugin preview for `$SHA` is ready: $MIRROR_URL (run: $RUN_URL)$UPSTREAM_LINE"

  failure:
    needs: [target, publish]
    if: always() && needs.target.outputs.sha != '' && needs.publish.result != 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Record failure
        env:
          SHA: ${{ needs.target.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq --arg sha "$SHA" --arg completedAt "$NOW" --arg runUrl "$RUN_URL" \
            '.failures = ((.failures // []) | map(select(.sha != $sha)) + [{sha:$sha, completedAt:$completedAt, runUrl:$runUrl}])' \
            vite-plugin-failures.json > vite-plugin-failures.json.tmp
          mv vite-plugin-failures.json.tmp vite-plugin-failures.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vite-plugin-failures.json
          git commit -m "ci: record failed Vite plugin preview for $SHA"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ needs.target.outputs.sha }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE" --repo "$REPO" --body "Vite plugin preview for `$SHA` failed: $RUN_URL"
